name: Bourseeye All Gold Funds Probe

on:
  push:
    branches:
      - test/bourseeye-http-probe
    paths:
      - .github/workflows/bourseeye-http-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-all-funds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch and validate all gold fund histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-output
          python3 - <<'PY'
          import csv, re, sys, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          BASE = "https://bourseeye.com"
          LIST_URL = BASE + "/funds/gold"
          HEADERS = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}

          def get(url):
              req = Request(url, headers=HEADERS)
              with urlopen(req, timeout=45) as r:
                  body = r.read().decode("utf-8", "replace")
                  return r.status, r.geturl(), body

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="a":
                      d=dict(attrs)
                      h=d.get("href","")
                      if re.match(r"^/funds/\d+/",h) and not h.endswith("/history"):
                          self.hrefs.append(h.split("?")[0].rstrip("/"))

          class PlainText(HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts=[]
              def handle_data(self, data):
                  if data.strip(): self.parts.append(data.strip())

          class TableRows(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.row=None; self.cell=None; self.in_table=False
              def handle_starttag(self, tag, attrs):
                  t=tag.lower()
                  if t=="table": self.in_table=True
                  elif self.in_table and t=="tr": self.row=[]
                  elif self.in_table and t in ("td","th") and self.row is not None: self.cell=[]
              def handle_data(self, data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self, tag):
                  t=tag.lower()
                  if t in ("td","th") and self.cell is not None and self.row is not None:
                      self.row.append(" ".join(" ".join(self.cell).split())); self.cell=None
                  elif t=="tr" and self.row is not None:
                      self.rows.append(self.row); self.row=None
                  elif t=="table": self.in_table=False

          def norm(s):
              trans=str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩٬٫−", "01234567890123456789,.-")
              return s.translate(trans)

          status, final_url, listing = get(LIST_URL)
          if status != 200 or len(listing)<10000:
              raise RuntimeError(f"Gold-fund list failed: HTTP {status}, bytes={len(listing)}")
          links=Links(); links.feed(listing)
          paths=sorted(set(links.hrefs))
          if len(paths)<10:
              raise RuntimeError(f"Could not discover fund pages from listing; links={len(paths)}")
          print(f"LIST_HTTP={status}; FUND_LINKS={len(paths)}; URL={final_url}")

          def check(path):
              name_url=BASE+path
              # Resolve the canonical slug URL first. Numeric-only routes redirect to
              # the canonical fund URL; append /history only after that redirect.
              try:
                  ds0, canonical_url, detail0=get(name_url)
                  if ds0 != 200:
                      canonical_url=name_url
              except Exception:
                  canonical_url=name_url
              hist_url=canonical_url.rstrip("/")+"/history"
              result={"path":path,"history_http":0,"rows":0,"valid_nav":0,"valid_close_nav":0,"has_adjusted_nav":False,"history_ok":False,"detail_http":0,"flow_marker":False,"flow_text_excerpt":"","error":""}
              # History and detail are tested independently.
              try:
                  hs, hu, html=get(hist_url)
                  result["history_http"]=hs
                  parser=TableRows(); parser.feed(html)
                  rows=parser.rows
                  result["rows"]=max(0,len(rows)-1)
                  header=" ".join(rows[0]) if rows else ""
                  result["has_adjusted_nav"]=("تعدیل" in header)
                  # Expected order: date, NAV issue, NAV redemption, adjusted NAV, closing price, bubble
                  for row in rows[1:]:
                      cells=[norm(c) for c in row]
                      if len(cells)>=5:
                          nav=bool(re.search(r"\d",cells[2]))
                          close=bool(re.search(r"\d",cells[4]))
                          if nav: result["valid_nav"]+=1
                          if nav and close: result["valid_close_nav"]+=1
                  # Require at least 60 genuinely paired close/NAV observations.
                  result["history_ok"]=(hs==200 and result["rows"]>=60 and result["valid_nav"]>=60 and result["valid_close_nav"]>=60 and result["has_adjusted_nav"])
              except Exception as e:
                  result["error"]="history: "+str(e)[:220]
              try:
                  ds, du, detail=get(canonical_url)
                  result["detail_http"]=ds
                  plain=PlainText(); plain.feed(detail)
                  txt=" ".join(plain.parts)
                  result["flow_marker"]=("صدور" in txt and "ابطال" in txt and ("خالص" in txt or "ورود پول" in txt))
                  excerpts=[]
                  for term in ("خالص صدور","صدور و ابطال","ورود پول","ابطال"):
                      pos=txt.find(term)
                      if pos>=0:
                          excerpts.append(txt[max(0,pos-100):min(len(txt),pos+260)])
                  result["flow_text_excerpt"]=" || ".join(excerpts[:4])[:1400]
              except Exception as e:
                  msg="detail: "+str(e)[:180]
                  result["error"]=(result["error"]+"; "+msg).strip("; ")
              return result

          results=[]
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures=[pool.submit(check,p) for p in paths]
              for f in as_completed(futures):
                  results.append(f.result())
          results.sort(key=lambda x:x["path"])
          with open("probe-output/funds.csv","w",newline="",encoding="utf-8-sig") as f:
              w=csv.DictWriter(f,fieldnames=list(results[0].keys())); w.writeheader(); w.writerows(results)
          passed=sum(x["history_ok"] for x in results)
          flows=sum(x["flow_marker"] and x["detail_http"]==200 for x in results)
          summary=[
            f"Fund links discovered: {len(paths)}",
            f"History pages HTTP 200: {sum(x['history_http']==200 for x in results)}",
            f"History pages meeting validation: {passed}",
            f"Detail pages HTTP 200: {sum(x['detail_http']==200 for x in results)}",
            f"Detail pages with issuance/redemption flow markers: {flows}",
            "",
            "Validation now requires at least 60 paired closing-price/NAV rows.",
            "flow_text_excerpt in funds.csv shows text around flow-related terms; it is not proof of daily numeric flow availability.",
          ]
          open("probe-output/summary.txt","w",encoding="utf-8").write("\n".join(summary))
          print("\n".join(summary))
          for x in results:
              print(f"{x['path']} | rows={x['rows']} | nav={x['valid_nav']} | paired={x['valid_close_nav']} | history_ok={x['history_ok']} | flow_marker={x['flow_marker']} | error={x['error']}")
          if passed != len(paths):
              print("PROBE_RESULT=PARTIAL")
              sys.exit(1)
          print("PROBE_RESULT=PASS")
          PY
      - name: Upload all-funds probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourseeye-all-funds-report
          path: probe-output/
          retention-days: 14
