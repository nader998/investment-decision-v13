name: Build Android Release APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/auto-fund-data-completion

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run unit tests
        run: gradle --no-daemon test

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Android emulator smoke test and live fund fetch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            APK=app/build/outputs/apk/release/app-release.apk
            adb install -r "$APK"
            adb shell am force-stop com.example.investmentdecision || true
            adb shell am start -n com.example.investmentdecision/.MainActivity
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/main.xml >/dev/null
            grep -q 'تصمیم‌یار سرمایه‌گذاری' /tmp/main.xml
            adb shell am start -n com.example.investmentdecision/.GoldFundStrategyActivity
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/strategy.xml >/dev/null
            grep -q 'نوسان‌گیری صندوق‌های طلا' /tmp/strategy.xml
            adb shell am start -n com.example.investmentdecision/.GoldFundAutoDataActivity
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/auto.xml >/dev/null
            python3 - <<'PY'
            import re, xml.etree.ElementTree as ET, subprocess, time
            path='/tmp/auto.xml'
            root=ET.parse(path).getroot()
            target='دریافت / به‌روزرسانی اطلاعات'
            bounds=None
            for node in root.iter('node'):
                if target in node.attrib.get('text',''):
                    bounds=node.attrib.get('bounds')
                    break
            if not bounds:
                raise SystemExit('AUTO_FETCH_BUTTON_NOT_FOUND')
            nums=list(map(int,re.findall(r'\\d+',bounds)))
            x=(nums[0]+nums[2])//2; y=(nums[1]+nums[3])//2
            subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
            print('LIVE_FETCH_STARTED')
            deadline=time.time()+300
            latest=''
            while time.time()<deadline:
                time.sleep(15)
                subprocess.run(['adb','shell','uiautomator','dump','/sdcard/window.xml'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                subprocess.run(['adb','pull','/sdcard/window.xml',path],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                try:
                    latest=open(path,encoding='utf-8').read()
                except Exception:
                    continue
                if 'تعداد نمادهای شناسایی‌شده' in latest or 'دریافت اطلاعات جدید ناموفق بود' in latest:
                    break
            print(latest[:12000])
            symbols=['عیار','مثقال','کهربا','گنج','گوهر','ریتون','امرالد','آلتون','گلدا','رز ترنج','زمرد','آتش','جواهر','جام طلا','زرفام','زروان','لیان','درخشان','ناب','تابش','نفیس','زرگر','قیراط','رزگلد','همیان','میراث','گلدیس','درنا','نگین فارس']
            found=[s for s in symbols if s in latest]
            print(f'VISIBLE_EXPECTED_SYMBOLS={len(found)}/29: {found}')
            if len(found)!=29:
                raise SystemExit('LIVE_FUND_SYMBOL_VALIDATION_FAILED')
            if 'بازده' not in latest or 'NAV' not in latest:
                raise SystemExit('FUND_METRIC_UI_VALIDATION_FAILED')
            print('EMULATOR_AND_LIVE_FUND_FETCH_SMOKE_TEST_PASSED')
            PY

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: investment-decision-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
